<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian siswa — PENDAPE</title>
<style>
:root{--bg:#f1f6f4;--card:#fff;--ink:#142d2c;--muted:#637775;--line:#d4e0dc;--acc:#087f75;--ok:#16794a;--bad:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Arial}main{max-width:720px;margin:auto;padding:16px}h1{font-size:1.8rem;margin:8px 0 2px}.sub{color:var(--muted);margin:0 0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}label{display:block;font-weight:650;margin:10px 0 4px;font-size:.9rem}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}button{font:inherit;font-weight:650;padding:10px 14px;border:0;border-radius:9px;background:var(--acc);color:#fff;cursor:pointer}button.alt{background:#e6f2ef;color:#075e56;border:1px solid #bddbd4}button:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:700}.timer{font-variant-numeric:tabular-nums;background:#fff0df;color:#8b4d00;padding:6px 11px;border-radius:9px}.bar{height:7px;background:#e5eeeb;border-radius:9px;margin:12px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}.question{font-size:1.15rem;font-weight:700}.qimg{max-width:100%;max-height:260px;display:block;border-radius:10px;margin:12px 0}.opt{display:block;width:100%;text-align:left;background:#f5f8f7;color:var(--ink);border:1px solid var(--line);margin:8px 0}.opt.sel{border:2px solid var(--acc);background:#e6f4f0}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.palette{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.palette button{min-width:42px;padding:8px;background:#edf2f0;color:#425a56;border:1px solid var(--line)}.palette button.done{background:#d9f2e4;color:#145a37}.palette button.current{outline:2px solid var(--acc)}.counts{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.9rem}.hide{display:none}.error{color:var(--bad);font-weight:650}.score{font-size:3.4rem;font-weight:850;line-height:1}.success{color:var(--ok)}@media(max-width:480px){.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<h1>Ujian siswa</h1><p class="sub">PENDAPE · Platform Penilaian Digital Peserta Didik</p>
<section class="card" id="login"><label>File soal dari guru (.json)</label><input id="file" type="file" accept=".json,application/json"><label>Token ujian</label><input id="token" type="password" inputmode="numeric"><label>Nama siswa</label><input id="nama" type="text" autocomplete="off"><label>Kelas</label><input id="kelas" type="text" placeholder="Contoh: VII-A"><button id="start" style="margin-top:14px">Mulai ujian</button><p id="err" class="error"></p></section>
<section class="card hide" id="exam"><div class="top"><span id="title"></span><span class="timer" id="timer">00:00</span></div><div class="bar"><i id="progress"></i></div><div class="top"><span id="number"></span><span id="status"></span></div><p class="question" id="question"></p><img id="qimg" class="qimg hide"><div id="options"></div><div class="nav"><button class="alt" id="prev">Kembali</button><button id="next">Selanjutnya</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><b>Navigasi soal</b><div class="counts"><span>● Belum dijawab</span><span class="success">● Sudah dijawab</span></div><div id="palette" class="palette"></div><button class="alt" id="finish" style="margin-top:16px;width:100%">Selesaikan ujian</button></section>
<section class="card hide" id="result"><p class="sub">HASIL UJIAN PENDAPE</p><div id="student"></div><p class="score" id="score"></p><b id="detail"></b><p class="sub" id="timeused"></p><canvas id="certificate" style="width:100%;border:1px solid var(--line);border-radius:10px;margin-top:12px"></canvas><button id="shot" style="width:100%;margin-top:12px">Simpan hasil sebagai gambar</button></section>
</main>
<script>
const $=id=>document.getElementById(id);let data=null,answers=[],at=0,remain=0,started=0,tick=null,finished=false;
function show(id){['login','exam','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function sha256(ascii){
const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
const bytes=[];for(let i=0;i<ascii.length;i++)bytes.push(ascii.charCodeAt(i)&255);
const bitLen=bytes.length*8;bytes.push(128);while(bytes.length%64!==56)bytes.push(0);
const hi=Math.floor(bitLen/0x100000000),lo=bitLen>>>0;
for(let n=3;n>=0;n--)bytes.push((hi>>>(n*8))&255);for(let n=3;n>=0;n--)bytes.push((lo>>>(n*8))&255);
const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
for(let off=0;off<bytes.length;off+=64){const w=new Array(64);for(let i=0;i<16;i++){let j=off+i*4;w[i]=((bytes[j]<<24)|(bytes[j+1]<<16)|(bytes[j+2]<<8)|bytes[j+3])>>>0}
for(let i=16;i<64;i++){let x=w[i-15],y=w[i-2],s0=rotr(x,7)^rotr(x,18)^(x>>>3),s1=rotr(y,17)^rotr(y,19)^(y>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
let [a,b,c,d,e,f,g,h]=H;
for(let i=0;i<64;i++){let S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
$('start').onclick=()=>{let f=$('file').files[0],token=$('token').value.trim(),name=$('nama').value.trim(),kelas=$('kelas').value.trim();$('err').textContent='';if(!f||!token||!name||!kelas){$('err').textContent='Lengkapi file soal, token, nama siswa, dan kelas.';return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.tokenHash||!d.salt||!Array.isArray(d.soal)||!d.soal.length)throw 0;if(sha256(unescape(encodeURIComponent(token+'|'+d.salt)))!==d.tokenHash)throw 1;data=d;answers=Array(d.soal.length).fill(null);at=0;remain=Math.max(1,Number(d.durasi)||60)*60;started=Date.now();finished=false;show('exam');render();timer();if(window.AndroidBridge&&AndroidBridge.examStarted)AndroidBridge.examStarted();tick=setInterval(()=>{remain--;timer();if(remain<=0)finish()},1000)}catch(e){$('err').textContent=e===1?'Token salah.': 'File soal tidak valid atau rusak.'}};r.readAsText(f)};
function timer(){let m=Math.floor(remain/60),s=remain%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('timer').style.background=remain<=300?'#ffe3e0':'#fff0df';$('timer').style.color=remain<=300?'#a3221b':'#8b4d00'}
function render(){let s=data.soal[at];$('title').textContent=data.judul;$('number').textContent='Soal '+(at+1)+' / '+data.soal.length;$('status').textContent=answers[at]?'Sudah dijawab':'Belum dijawab';$('progress').style.width=((at+1)/data.soal.length*100)+'%';$('question').textContent=s.q;if(s.gambar){$('qimg').src=s.gambar;$('qimg').classList.remove('hide')}else $('qimg').classList.add('hide');let o=$('options');o.innerHTML='';['a','b','c','d'].forEach(k=>{let b=document.createElement('button');b.className='opt'+(answers[at]===k?' sel':'');b.textContent=k.toUpperCase()+'. '+s[k];b.onclick=()=>{answers[at]=k;render()};o.append(b)});$('prev').disabled=at===0;$('next').textContent=at===data.soal.length-1?'Soal terakhir':'Selanjutnya';let p=$('palette');p.innerHTML='';answers.forEach((v,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(v?'done ':'')+(i===at?'current':'');b.onclick=()=>{at=i;render()};p.append(b)})}
$('prev').onclick=()=>{if(at>0){at--;render()}};$('next').onclick=()=>{if(at<data.soal.length-1){at++;render()}};
$('finish').onclick=()=>{let unanswered=answers.filter(x=>!x).length;if(unanswered&&!confirm('Masih ada '+unanswered+' soal belum dijawab. Tetap selesaikan?'))return;finish()};
function finish(){if(finished)return;finished=true;if(window.AndroidBridge&&AndroidBridge.examFinished)AndroidBridge.examFinished();if(tick)clearInterval(tick);let correct=0;data.soal.forEach((s,i)=>{if(answers[i]===s.kunci)correct++});let wrong=data.soal.length-correct,score=Math.round(correct/data.soal.length*100);let elapsed=Math.round((Date.now()-started)/1000);$('student').textContent=$('nama').value+' · '+$('kelas').value+' · '+data.judul;$('score').textContent=score;$('detail').textContent=correct+' benar · '+wrong+' salah · '+data.soal.length+' soal';$('timeused').textContent='Waktu pengerjaan: '+Math.floor(elapsed/60)+' menit '+(elapsed%60)+' detik';show('result');drawResult(score,correct,wrong)}
function drawResult(score,correct,wrong){let c=$('certificate'),ctx=c.getContext('2d');c.width=1000;c.height=560;ctx.fillStyle='#f4faf7';ctx.fillRect(0,0,1000,560);ctx.strokeStyle='#087f75';ctx.lineWidth=12;ctx.strokeRect(20,20,960,520);ctx.fillStyle='#102d36';ctx.textAlign='center';ctx.font='bold 46px Arial';ctx.fillText('PENDAPE',500,105);ctx.font='24px Arial';ctx.fillText('HASIL PENILAIAN DIGITAL',500,150);ctx.font='bold 34px Arial';ctx.fillText($('nama').value+'  ·  '+$('kelas').value,500,235);ctx.font='bold 100px Arial';ctx.fillStyle='#087f75';ctx.fillText(String(score),500,365);ctx.fillStyle='#102d36';ctx.font='bold 27px Arial';ctx.fillText('SKOR',500,410);ctx.font='24px Arial';ctx.fillText(correct+' BENAR     •     '+wrong+' SALAH',500,470);ctx.font='18px Arial';ctx.fillText(data.judul,500,510)}
$('shot').onclick=()=>{let name='hasil_'+$('nama').value.trim().replace(/\\s+/g,'_')+'.png';let url=$('certificate').toDataURL('image/png');if(window.AndroidBridge&&AndroidBridge.saveBase64File){AndroidBridge.saveBase64File(url.split(',')[1],name,'image/png');return}let a=document.createElement('a');a.download=name;a.href=url;a.click()};
document.addEventListener('contextmenu',e=>{if(!finished&&$('exam').classList.contains('hide')===false)e.preventDefault()});document.addEventListener('keydown',e=>{if(!finished&&!$('exam').classList.contains('hide')&&['F12','F5'].includes(e.key)){e.preventDefault()}});
</script></body></html>
