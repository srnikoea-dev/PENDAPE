plugins {
    id 'com.android.application'
}

android {
    namespace 'id.keramat.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.keramat.app'
        minSdk 24
        targetSdk 34          // naikkan dari 28
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
